# CI for OpenDroneKit.
#
# Four jobs, because these things cannot be checked the same way.
#
# `tests` is the fast one and runs on every push. It covers the whole suite except the
# parts that need infrastructure, and it is the gate that must stay green.
#
# `status` computes the feature registry from what actually passed, and it runs last
# because it needs results from more than one runner. Skipped tests count as no evidence
# rather than as passes, so it can only see a flight test succeed if a container ran it
# and published the report.
#
# `spatial` and `sitl` exist because of a specific failure mode this project keeps
# hitting: a test that skips when its dependency is absent reports success while
# checking nothing. Locally that is the right behaviour -- a developer without Docker
# should not be blocked. In CI it would be a lie, so both jobs assert that their tests
# actually RAN rather than skipped.
#
# fl.sitl is the reason the sitl job exists at all. The flight tests pass against real
# ArduPilot in a container and skip under a plain pytest, so the registry row reads
# not_started on a laptop no matter how many times the container goes green. CI is the
# only place that gap can close.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The workspace UI is executed rather than eyeballed, and that needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # torch is NOT a runtime dependency -- the runtime loads ONNX through cv2.dnn --
      # so it is deliberately absent from requirements.txt. But the training tests import
      # it, and they carry importorskip so a machine without torch can still run the
      # suite. A skip in CI is the lie this workflow exists to prevent, so the CPU wheel
      # goes in here: ~200 MB, no CUDA, and those tests actually run.
      # torchvision comes with it because the segmentation trainers import it for their
      # encoders; torch alone leaves those tests failing on an import rather than
      # checking anything.
      - name: Install torch (CPU) so the training tests run rather than skip
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Test
        run: python -m pytest -q --durations=15

      # The strict status check lives in its own job below, because it needs the SITL
      # evidence and that is produced by a different runner.

  spatial:
    name: PostGIS spatial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: odk
          POSTGRES_DB: odk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spatial tests
        env:
          ODK_TEST_POSTGIS: postgresql+psycopg://postgres:odk@127.0.0.1:5432/odk
        # The junit report is this job's evidence, for the same reason the SITL job
        # publishes one: these tests skip without a live PostGIS, a skip counts as no
        # evidence, and inf.postgis would be downgraded in the status job by a suite
        # that in fact passed here.
        run: |
          python -m pytest tests/test_postgis_spatial.py -q \
            --junit-xml=spatial-report.xml

      - name: They must have run, not skipped
        # Without this the job is green when the database never came up, which is the
        # exact failure the tests exist to catch.
        env:
          ODK_TEST_POSTGIS: postgresql+psycopg://postgres:odk@127.0.0.1:5432/odk
        run: |
          python -m pytest tests/test_postgis_spatial.py -q --collect-only >/dev/null
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "pytest", "tests/test_postgis_spatial.py", "-q"],
              capture_output=True, text=True).stdout
          if "skipped" in out and "passed" not in out:
              sys.exit("spatial tests skipped in CI: PostGIS was not reachable")
          print(out.strip().splitlines()[-1])
          PY

      - name: Publish the spatial evidence
        uses: actions/upload-artifact@v4
        with:
          name: spatial-report
          path: spatial-report.xml

  sitl:
    name: SITL flight tests
    runs-on: ubuntu-latest
    # Building ArduPilot from source takes 15-25 minutes and is pinned to a release tag,
    # because a simulator whose behaviour moves under the tests turns a red run into an
    # unanswerable question.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the SITL image
        run: docker build -f infrastructure/docker/Dockerfile.sitl -t opendronekit-sitl:ci .

      - name: Fly the tests against real ArduPilot
        # The junit report is the artefact that matters beyond this job: fl.sitl cannot
        # be earned on a machine without ArduPilot, so this run is the only evidence
        # that exists for it anywhere.
        run: |
          # The image runs as an unprivileged `sitl` user, which cannot write into the
          # checkout. Both flights passed and then junitxml raised PermissionError on
          # the way out, losing the evidence and the pass count with it -- so the report
          # goes to a directory made writable for it.
          mkdir -p sitl-out && chmod 777 sitl-out
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/sitl-out:/out" \
            opendronekit-sitl:ci \
            python3 -m pytest -m sitl tests/sitl -v --junit-xml=/out/sitl-report.xml \
            | tee sitl.log

      - name: They must have run, not skipped
        # The whole point of this job. A skipped SITL suite is what makes fl.sitl read
        # not_started, and a green tick over a skip would hide that permanently.
        run: |
          if grep -qE "no tests ran|all skipped" sitl.log; then
            echo "SITL tests did not run"; exit 1
          fi
          grep -E "[0-9]+ passed" sitl.log

      # Published so the status job can count a run this repository cannot reproduce
      # anywhere else. Without it fl.sitl reads not_started forever, however green the
      # container is.
      - name: Publish the flight evidence
        uses: actions/upload-artifact@v4
        with:
          name: sitl-report
          path: sitl-out/sitl-report.xml

  status:
    name: Feature status
    # Needs both, because status is computed from what actually passed and the two jobs
    # prove different things. `tests` covers everything runnable on a plain runner; only
    # `sitl` can produce evidence for a flight test, and only in a container.
    needs: [tests, spatial, sitl]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Collect the flight evidence
        uses: actions/download-artifact@v4
        with:
          name: sitl-report

      - name: Collect the spatial evidence
        uses: actions/download-artifact@v4
        with:
          name: spatial-report

      - name: The evidence must be real
        # A missing or empty report would otherwise let the next step quietly compute
        # status as though SITL had never been asked about -- which is the pre-CI
        # situation this whole job exists to end.
        run: |
          test -s sitl-report.xml || { echo "no SITL evidence to merge"; exit 1; }
          grep -q "<testcase" sitl-report.xml || { echo "SITL report has no cases"; exit 1; }
          test -s spatial-report.xml || { echo "no spatial evidence to merge"; exit 1; }
          grep -q "<testcase" spatial-report.xml || { echo "spatial report has no cases"; exit 1; }

      - name: Feature status must not regress
        # --strict exits non-zero when any row drops below what it claims, which is the
        # only automated defence against a capability quietly breaking: status is computed
        # from passing tests, so a broken test silently downgrades a row.
        #
        # --extra-report merges the container's results. A skipped test counts as no
        # evidence rather than as a pass, so without this fl.sitl would be downgraded
        # here exactly as it is on a laptop.
        run: |
          python tools/feature_status.py --strict \
            --extra-report sitl-report.xml \
            --extra-report spatial-report.xml

      - name: Generate the document, which only this machine has the evidence for
        # A laptop has the trained weights and no SITL container; the runner has the
        # container's results merged in and no weights. Neither can write an honest
        # FEATURES.md alone, and the tool now refuses on the laptop rather than demoting
        # rows CI proves. Here the extra reports are present, so this is the one place the
        # document can be generated from complete evidence.
        if: always()
        run: |
          python tools/feature_status.py --markdown \
            --extra-report sitl-report.xml \
            --extra-report spatial-report.xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: features-md
          path: docs/FEATURES.md

      - name: Publish the count this machine can reproduce
        # docs/FEATURES.md is generated on a development machine, where the trained
        # weights exist, and reaches a higher verified count than this runner can. That is
        # legitimate -- the weights are gigabytes and are not in the repository -- but it
        # means the published number is not the one a fresh clone reproduces. So emit the
        # runner's own status as an artifact: the two are then comparable instead of one
        # being invisible.
        if: always()
        run: |
          python tools/feature_status.py --json \
            --extra-report sitl-report.xml \
            --extra-report spatial-report.xml > feature-status-ci.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-status-ci
          path: feature-status-ci.json
