[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

filterwarnings =
    # test_jobs deliberately kills a worker with SystemExit to prove the manager
    # records it instead of leaving the job reading "running" forever. The dying
    # thread is the behaviour under test, not a defect.
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    # rasterio warns when asked to open a file with no geotransform;
    # test_dsm_analysis does that on purpose to check the raster is refused.
    ignore:Dataset has no geotransform.*:UserWarning
