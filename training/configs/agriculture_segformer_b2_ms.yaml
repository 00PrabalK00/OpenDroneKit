# Maize crop and weed separation: WeedsGalore, 156 multispectral UAV captures.
#
# The authors' own split is preserved: 104 train, 26 validation, 26 test. This is
# intentionally a small demonstration corpus, not evidence of field readiness.
#
# Source masks use semantic ids 0/1/3/5: soil, maize and two weed species. The
# preparation adapter merges 3 and 5 and writes the dense model ids below:
#   0 soil, 1 maize, 2 weed
# The trainer refuses any other id instead of clamping or guessing its meaning.
#
# The source captures have B/G/R/RE/NIR bands, but the prepared corpus currently
# contains RGB composites. The resulting checkpoint must be described as RGB-only;
# it does not use the red-edge/NIR evidence that would normally separate vegetation.
name: agriculture_segformer_b2_ms
data_root: training/data/prepared/agriculture_seg
model_id: nvidia/mit-b2
num_classes: 3
class_names: [soil, maize, weed]
image_size: 512
batch_size: 8
grad_accum: 1
epochs: 80
lr: 0.00006
encoder_lr: 0.000006
weight_decay: 0.01
warmup_fraction: 0.05
num_workers: 4
seed: 1337
amp_dtype: bf16
ema_decay: 0.999
# Data-derived ENet-style log-inverse weights keep rare weed pixels visible to CE.
class_weighting: log_inverse
# Nadir field imagery has no canonical orientation.
fliplr: 0.5
flipud: 0.5
degrees: 180.0
early_stop_patience: 12
val_interval: 1
output_dir: training/runs
max_train_samples: 0
# Release gates:
#  - Report soil, maize and weed IoU separately; select on their mean.
#  - State the 104-image training size and RGB-only input in the model manifest.
#  - Compare against the source release's DeepLabv3+ baselines before claiming the
#    architecture choice is justified.

# Five bands rather than three. The corpus keeps an RGB composite so every other
# trainer still works, but crop and weed separation lives mostly in red edge and near
# infrared -- a weed and a maize leaf differ far more in reflectance than in visible
# colour -- so RGB alone uses the bands that discriminate least. These stacks are
# cached by the WeedsGalore adapter in R,G,B,RE,NIR order.
#
# Train the RGB config too and compare: the point is to show the extra bands earn their
# place, not to assume it.
band_root: training/data/_work/weedsgalore_bands
