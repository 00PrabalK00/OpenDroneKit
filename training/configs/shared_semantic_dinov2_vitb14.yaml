# Architecture contract only. This is not a task-trained production model.
name: shared_semantic_dinov2_vitb14
status: architecture_only
architecture:
  encoder: dinov2_vitb14
  encoder_checkpoint: models/pretrained/dinov2_vitb14_pretrain.pth
  encoder_source: training/sources/dinov2
  encoder_source_type: local
  encoder_source_commit: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
  encoder_license: Apache-2.0
  intermediate_layers: [2, 5, 8, 11]
  decoder: opendronekit_upernet
  decoder_channels: 256
  ppm_scales: [1, 2, 3, 6]
schema:
  id: india_shared_landcover
  version: 0.1.0-draft
  classes:
    - {id: 0, name: background, color_rgb: [0, 0, 0], background: true}
    - {id: 1, name: building, color_rgb: [220, 60, 60]}
    - {id: 2, name: road, color_rgb: [120, 120, 120]}
    - {id: 3, name: vegetation, color_rgb: [40, 150, 60]}
    - {id: 4, name: water, color_rgb: [45, 110, 210]}
    - {id: 5, name: bare_land, color_rgb: [180, 135, 75]}
inference:
  tile_size: 518
  overlap: 126
  device: cuda
  allow_cpu: false
  max_cpu_pixels: 4000000
  min_polygon_area_m2: 1.0
training:
  seed: 42
  tile_size: 518
  batch_size: 1
  workers: 0
  epochs: 40
  learning_rate: 0.0002
  encoder_learning_rate: 0.00002
  min_learning_rate: 0.000002
  weight_decay: 0.01
  gradient_accumulation: 8
  max_grad_norm: 1.0
  mixed_precision: true
  class_balance: log_inverse
  # Penalises predicting a class on pixels the annotation says it is absent from.
  # SpaceNet 7 leaves 96.7% of each tile unlabelled while having drawn every building,
  # so without this a false building costs nothing there.
  absent_class_weight: 1.0
  # Metres per pixel every tile is resampled to before the model sees it.
  #
  # Without this the loader cropped a fixed 518 pixels from sources measured at 0.20 to
  # 4.77 m/px -- a spread of twenty-four times -- so one crop covered 104 m of ground and
  # another 2.5 km, and both were handed to the model as the same thing. A building was a
  # two-pixel blob in one and filled the frame in the other, and the prior learned from
  # the coarse half is what predicts building over 0.244 of a fine-resolution frame that
  # is 0.092 building.
  #
  # 0.30 is OpenEarthMap's median rather than SpaceNet 7's: this is a drone product, the
  # fine end is the end that matters, and upsampling the coarse source is honest about
  # how little it actually resolves.
  target_gsd: 0.30
  freeze_encoder: false
release_gates:
  - Train the decoder and fine-tune the encoder on the frozen schema.
  - Validate with site-separated and date-separated India holdouts.
  - Export the complete encoder and decoder to ONNX and verify parity.
  - Write a semantic model manifest with exact checkpoint SHA-256 and metrics.
