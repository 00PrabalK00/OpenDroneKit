# YOLO11l solar PV defect detection. Sized for a free Kaggle P100 (16GB),
# which keeps the paid 4090 hours for the two heavy models.
name: solar_yolo11l
data_root: training/data/prepared/solar_det
model_id: yolo11l.pt
image_size: 1024
batch_size: 8
epochs: 100
lr: 0.01
optimizer: auto
patience: 20
seed: 1337
workers: 4
output_dir: training/runs
mosaic: 1.0
close_mosaic: 10
copy_paste: 0.2
mixup: 0.1
# Panels sit on a regular grid, so large rotations produce unrealistic layouts.
degrees: 5.0
perspective: 0.0003
cos_lr: true
amp: true
