# OpenDroneKit, self-hosted.
#
#   cp .env.example .env   and edit it
#   docker compose up -d
#
# Nothing here reaches a proprietary service. PostGIS holds the data, SeaweedFS holds
# the objects, and both run on your own infrastructure.

name: opendronekit

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendronekit}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns before the database accepts connections on first boot,
      # so the API waits on this rather than on the container merely being up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odk} -d ${POSTGRES_DB:-opendronekit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # S3-compatible object storage. SeaweedFS, because MinIO stopped publishing its
  # images: `docker pull minio/minio` and `quay.io/minio/minio` both answer "access
  # denied" (checked 2026-09-29), so a compose file naming them cannot start at all.
  # The API speaks plain S3 (services/api/storage.py), so nothing else changed: the
  # same ODK_S3_* variables, the same bucket, the endpoint on port 8333.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      ODK_S3_ACCESS_KEY: ${ODK_S3_ACCESS_KEY:?set ODK_S3_ACCESS_KEY in .env}
      ODK_S3_SECRET_KEY: ${ODK_S3_SECRET_KEY:?set ODK_S3_SECRET_KEY in .env}
    # The S3 gateway accepts exactly one identity: the keys from .env. Written at start
    # from the environment, so the credentials never sit in this file or in the image.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/seaweedfs
        umask 077
        printf '{"identities":[{"name":"opendronekit","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}\n' "$$ODK_S3_ACCESS_KEY" "$$ODK_S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        chown seaweed:seaweed /etc/seaweedfs/s3.json
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "${ODK_S3_PORT:-8333}:8333"

  # Creates the bucket once, then exits. Without it the first upload fails against a
  # bucket that does not exist yet. The request is signed with the same keys the API
  # uses, so this also proves the credentials work before the API starts. 409
  # BucketAlreadyOwnedByYou on a later start is success.
  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      ODK_S3_ACCESS_KEY: ${ODK_S3_ACCESS_KEY}
      ODK_S3_SECRET_KEY: ${ODK_S3_SECRET_KEY}
      ODK_S3_BUCKET: ${ODK_S3_BUCKET:-opendronekit}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /tmp/answer -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user "$$ODK_S3_ACCESS_KEY:$$ODK_S3_SECRET_KEY" -X PUT "http://seaweedfs:8333/$$ODK_S3_BUCKET")
        if [ "$$code" = 200 ] || grep -q BucketAlreadyOwnedByYou /tmp/answer; then echo 'bucket ready'; exit 0; fi
        echo "bucket creation failed: HTTP $$code"; cat /tmp/answer; exit 1

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ODK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odk}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-opendronekit}
      ODK_SECRET_KEY: ${ODK_SECRET_KEY:?set ODK_SECRET_KEY in .env}
      ODK_STORAGE_BACKEND: ${ODK_STORAGE_BACKEND:-s3}
      ODK_STORAGE_PATH: /data/storage
      ODK_S3_ENDPOINT: http://seaweedfs:8333
      ODK_S3_BUCKET: ${ODK_S3_BUCKET:-opendronekit}
      ODK_S3_ACCESS_KEY: ${ODK_S3_ACCESS_KEY}
      ODK_S3_SECRET_KEY: ${ODK_S3_SECRET_KEY}
      ODK_CORS_ORIGINS: ${ODK_CORS_ORIGINS:-}
      ODK_LOG_LEVEL: ${ODK_LOG_LEVEL:-INFO}
      # Processing jobs go to the Celery worker below, AI jobs to ai-worker; the API
      # process only records and serves them.
      ODK_JOB_BACKEND: celery
      ODK_BROKER_URL: redis://redis:6379/0
      ODK_AI_WORKER: external
    volumes:
      - api_storage:/data/storage
    # Readiness verifies the live database and object store, not only ASGI liveness.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${ODK_API_PORT:-8000}:8000"

  redis:
    # The processing broker. Open source, no managed service, no licence: a queue that
    # survives a restart is the difference between a backlog and a silent loss, because
    # an in-process queue does not fail its jobs when the process dies -- they simply
    # cease to exist and nothing reports their absence.
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so a restart of the broker itself does not drop the queue it exists to
    # protect. An unpersisted Redis reintroduces exactly the failure it was added for.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ODK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odk}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-opendronekit}
      ODK_BROKER_URL: redis://redis:6379/0
      ODK_STORAGE_BACKEND: ${ODK_STORAGE_BACKEND:-s3}
      ODK_STORAGE_PATH: /data/storage
      ODK_S3_ENDPOINT: http://seaweedfs:8333
      ODK_S3_BUCKET: ${ODK_S3_BUCKET:-opendronekit}
      ODK_S3_ACCESS_KEY: ${ODK_S3_ACCESS_KEY}
      ODK_S3_SECRET_KEY: ${ODK_S3_SECRET_KEY}
    volumes:
      - api_storage:/data/storage
    # The Celery worker, not a bare python process: this is what consumes the queue.
    command: ["python", "-m", "services.worker.tasks"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import core.geo' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ai-worker:
    # Claims pending AI jobs from the shared database and runs them. Needs model weights
    # under /app/models; a job naming a model whose weights are absent is refused at
    # submission with the missing path, never run on a substitute.
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      ODK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odk}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-opendronekit}
      ODK_STORAGE_PATH: /data/storage
    volumes:
      - api_storage:/data/storage
    command: ["python", "-m", "services.worker.ai_worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import services.api.inference' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  redis_data:
  postgis_data:
  seaweedfs_data:
  api_storage:
