# Defaults are deliberately conservative and deliberately incomplete.
#
# There is no default secret in this file. A chart that ships a working password is a
# chart that gets deployed with it, and "change this in production" has never once been
# read in time. Rendering fails without an explicit secret rather than starting something
# insecure that appears to work.

image:
  repository: opendronekit/api
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

worker:
  repository: opendronekit/worker
  tag: ""
  # The chart ships no Redis. With no broker the API runs jobs on its own threads
  # (ODK_JOB_BACKEND=thread) and a Celery worker would only crash-loop, so none is
  # started. Point brokerUrl at a Redis you run and raise replicas to use workers; the
  # API then enqueues jobs instead. Workers read uploads and write outputs under
  # ODK_STORAGE_PATH, so they also need a volume shared with the API (ReadWriteMany),
  # which this chart does not create.
  replicas: 0
  brokerUrl: ""
  resources:
    # Photogrammetry is memory-bound before it is CPU-bound: feature matching holds the
    # match graph for the whole block. A worker without a memory limit will be evicted
    # mid-job, which loses hours rather than degrading.
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 16Gi

api:
  # One replica until uploads and job outputs move to a volume every pod can read: a
  # chunked upload split across two pods' local disks cannot be assembled, and a job's
  # artifacts are only downloadable from the pod that wrote them.
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      memory: 4Gi

# Secrets. No defaults; see the note at the top of this file.
secrets:
  # Either set these, or set existingSecret to the name of one you manage yourself.
  existingSecret: ""
  odkSecretKey: ""
  postgresPassword: ""
  s3AccessKey: ""
  s3SecretKey: ""

postgis:
  enabled: true
  image: postgis/postgis:16-3.4
  database: opendronekit
  user: odk
  storage: 50Gi

# Object storage in the chart: a SeaweedFS S3 gateway. MinIO stopped publishing images
# (minio/minio and quay.io/minio/minio both refuse pulls as of 2026-09-29), and the
# endpoint this chart used to name, http://minio:9000, was never deployed by it. The
# gateway's only identity is secrets.s3AccessKey / s3SecretKey, which the API and
# worker also use. Disable it and set storage.endpoint to use an S3 you run instead.
seaweedfs:
  enabled: true
  image: chrislusf/seaweedfs:latest
  storage: 100Gi

storage:
  backend: s3
  bucket: opendronekit
  # Empty: the in-chart SeaweedFS gateway (http://<release>-opendronekit-seaweedfs:8333).
  endpoint: ""
  # Persistent volume for the API's local artefact cache.
  size: 100Gi

logLevel: INFO
corsOrigins: ""

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: false
  className: ""
  host: opendronekit.local
  tls: []
