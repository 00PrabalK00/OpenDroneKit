{{- include "odk.requireSecrets" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odk.fullname" . }}-secrets
  labels: {{- include "odk.labels" . | nindent 4 }}
type: Opaque
stringData:
  ODK_SECRET_KEY: {{ .Values.secrets.odkSecretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ODK_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  ODK_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
