apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk.fullname" . }}-api
  labels: {{- include "odk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "odk.name" . }}
    app.kubernetes.io/component: api
