{{- if .Values.postgis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk.fullname" . }}-postgis
  labels: {{- include "odk.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: {{ include "odk.name" . }}
    app.kubernetes.io/component: postgis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "odk.fullname" . }}-postgis
  labels: {{- include "odk.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "odk.fullname" . }}-postgis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "odk.name" . }}
      app.kubernetes.io/component: postgis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "odk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgis
    spec:
      containers:
        - name: postgis
          image: {{ .Values.postgis.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgis.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgis.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "odk.secretName" . }}, key: POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgis.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # A StatefulSet with its own claim, not a Deployment with an emptyDir. Survey data is
  # the one thing here that cannot be regenerated by re-running a job.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgis.storage }}
{{- end }}
